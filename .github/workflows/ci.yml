name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Bundle (ad-hoc signed)
        run: SIGN_IDENTITY=- scripts/bundle.sh

  linux:
    name: Core and modes build without AppKit (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target VimouseCore
      - run: for m in Pointer Half Hints Nudge Scroll Ruler Expand; do swift build --target "${m}Mode"; done
      - run: swift test
